- defaults:
    link:
      relink: true
      create: true
      force: true
      glob: true

- clean: ["~"]

- link:
    ~/.zshrc: config/.zshrc_arch
    ~/.bashrc: config/.bashrc
    ~/.zlogin: config/.zlogin
    ~/key-bindings.zsh: config/key-bindings.zsh
    ~/.zimrc: config/.zimrc
    ~/.gitconfig: config/git/.gitconfig
    ~/.config/BetterDiscord: config/BetterDiscord/**
    ~/.config/dunst/dunstrc: config/dunst/dunstrc
    ~/.config/hypr: config/hypr/**
    ~/.config/systemd/user: config/systemd/user/**
    ~/.config/nvim: config/nvim/**
    ~/.config/quickshell: config/quickshell/**
    ~/.config/wallpaper: config/wallpaper/**
    ~/.config/waybar: config/waybar/**
    ~/.config/starship/config.toml: config/starship/config.toml
    ~/.config/ghostty/config: config/ghostty/config
    ~/.config/discord/settings.json: config/discord/settings.json
    ~/.config/bat/bat.conf: config/bat/bat.conf
    ~/.usqlrc: config/usql/.usqlrc
    ~/.config/usql/config.yaml: config/usql/config.yaml
    ~/.config/zed/keymap.json: config/zed/keymap_linux.json
    ~/.config/zed/settings.json: config/zed/settings_linux.json
    ~/.config/zed/debug.json: config/zed/debug_python_example.json
    ~/.pi/agent/settings.json: config/pi/settings.json
    ~/.pi/agent/AGENTS.md: AGENTS.md
    ~/.pi/agent/skills: config/claude/skills
    ~/.pi/agent/themes: config/pi/themes
    ~/.pi/agent/extensions: config/pi/extensions
    ~/.pi/agent/agents: config/pi/agents
    ~/.config/gitui: config/gitui/**
    ~/.config/keybindings-helper: config/keybindings-helper/**
    ~/.config/delta: config/delta/**
    ~/.config/yazi: config/yazi/**
    ~/.config/eza: config/eza/**
    ~/.config/lazygit: config/lazygit/**
    ~/.config/wlogout/: config/wlogout/**
    ~/.config/btop/**: config/btop/**
    ~/.gtkrc-2.0: config/gtk-2.0/gtkrc
    ~/.config/gtk-2.0: config/gtk-2.0/**
    ~/.config/gtk-3.0: config/gtk-3.0/**
    ~/.config/gtk-4.0: config/gtk-4.0/**

- shell:
    - [git submodule update --init --recursive, Installing submodules]
