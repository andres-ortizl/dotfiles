name: lab

networks:
  traefik:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
  pihole_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  model-cache:
  immich-db:
  immich-redis:

services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.5.4
    container_name: traefik
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN=n33lab.com}
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
      - "9090:8080" # Traefik dashboard on port 9090
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard-secure.rule=Host(`traefik.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.dashboard-secure.entrypoints=websecure"
      - "traefik.http.routers.dashboard-secure.tls=true"
      - "traefik.http.routers.dashboard-secure.service=api@internal"

  # Glance Dashboard
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - DOMAIN=${DOMAIN:?set DOMAIN=n33lab.com}
      - PIHOLE_PASSWORD=${PIHOLE_PASSWORD:?set in .env}
    volumes:
      - ./config/glance:/app/config:ro
    networks:
      - traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glance.rule=Host(`${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.glance.entrypoints=web"
      - "traefik.http.routers.glance-secure.rule=Host(`${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.glance-secure.entrypoints=websecure"
      - "traefik.http.routers.glance-secure.tls=true"
      - "traefik.http.services.glance.loadbalancer.server.port=8080"

  # Dockhand - Docker Management UI
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/dockhand:/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dockhand.rule=Host(`docker.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.dockhand.entrypoints=web"
      - "traefik.http.routers.dockhand-secure.rule=Host(`docker.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.dockhand-secure.entrypoints=websecure"
      - "traefik.http.routers.dockhand-secure.tls=true"
      - "traefik.http.services.dockhand.loadbalancer.server.port=3000"

  # Tailscale - VPN Access
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: homeserver
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ROUTES=172.18.0.0/24,172.31.0.0/16,192.168.1.0/24
      - TS_ACCEPT_DNS=false
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - traefik
      - pihole_network

  # Pi-hole DNS Server
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:?set in .env}
      - FTLCONF_dns_upstreams=${PIHOLE_DNS:-1.1.1.1;1.0.0.1}
      - FTLCONF_dns_listeningMode=ALL
      - FTLCONF_dns_dnssec=true
      - FTLCONF_webserver_interface_theme=default-dark
      - FTLCONF_webserver_domain=pihole.${DOMAIN:?set DOMAIN=n33lab.com}
      - FTLCONF_misc_dnsmasq_lines=address=/n33lab.com/192.168.1.33
    volumes:
      - ./config/pihole/etc-pihole:/etc/pihole
    ports:
      - "192.168.1.33:53:53/tcp"
      - "192.168.1.33:53:53/udp"
      - "3333:80"
    dns:
      - 127.0.0.1
      - 1.1.1.1
    cap_add:
      - NET_ADMIN
    networks:
      traefik: {}
      pihole_network:
        ipv4_address: "172.31.0.100"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.pihole.entrypoints=web"
      - "traefik.http.routers.pihole-secure.rule=Host(`pihole.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.pihole-secure.entrypoints=websecure"
      - "traefik.http.routers.pihole-secure.tls=true"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      - "homepage.group=Network"
      - "homepage.name=Pi-hole"
      - "homepage.icon=pihole.png"
      - "homepage.href=http://pihole.${DOMAIN:?set DOMAIN=n33lab.com}:3333/admin"
      - "homepage.description=Network-wide ad blocking and DNS"
      - "homepage.weight=1"
      - "homepage.widget.type=pihole"
      - "homepage.widget.url=http://pihole"
      - "homepage.widget.key=${PIHOLE_API_KEY:-}"

  # DHCP Helper for Pi-hole
  dhcphelper:
    image: noamokman/dhcp-helper
    container_name: dhcp-helper
    restart: unless-stopped
    network_mode: "host"
    command: -s 172.31.0.100
    cap_add:
      - NET_ADMIN

  # qBittorrent Download Client
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_ROOT:-./data/shared}:/data
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=web"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.routers.qbittorrent-secure.rule=Host(`qbittorrent.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.qbittorrent-secure.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent-secure.tls=true"
      - "traefik.http.routers.qbittorrent-secure.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"

  # Immich Photo Management
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.0.1}
    container_name: immich_server
    restart: unless-stopped
    volumes:
      - ${UPLOAD_LOCATION:-./data/immich}:/data
      - /etc/localtime:/etc/localtime:ro
      - /home/andrew/immich:/mnt/old-immich:ro
      - /home/andrew/immich-test:/mnt/immich-test:ro
    environment:
      - DB_HOSTNAME=database
    env_file:
      - ./secrets/immich-server.env
    depends_on:
      - redis
      - database
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`immich.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.immich.entrypoints=web"
      - "traefik.http.routers.immich-secure.rule=Host(`immich.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.immich-secure.entrypoints=websecure"
      - "traefik.http.routers.immich-secure.tls=true"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
    healthcheck:
      disable: false

  # Immich Machine Learning
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.0.1}
    container_name: immich_machine_learning
    restart: unless-stopped
    volumes:
      - model-cache:/cache
    env_file:
      - ./secrets/immich-ml.env
    networks:
      - traefik
    healthcheck:
      disable: false

  # Immich Redis Cache
  redis:
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    container_name: immich_redis
    restart: unless-stopped
    volumes:
      - immich-redis:/data
    networks:
      - traefik
    healthcheck:
      test: redis-cli ping || exit 1

  # Immich PostgreSQL Database
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich-db:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - traefik

  # Open WebUI for AI
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./data/openwebui:/app/backend/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`chat.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.openwebui.entrypoints=web"
      - "traefik.http.routers.openwebui-secure.rule=Host(`chat.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.openwebui-secure.entrypoints=websecure"
      - "traefik.http.routers.openwebui-secure.tls=true"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Excalidraw Collaborative Whiteboard
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw.rule=Host(`excalidraw.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.excalidraw.entrypoints=web"
      - "traefik.http.routers.excalidraw-secure.rule=Host(`excalidraw.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.excalidraw-secure.entrypoints=websecure"
      - "traefik.http.routers.excalidraw-secure.tls=true"
      - "traefik.http.services.excalidraw.loadbalancer.server.port=80"

  # Gatus Monitoring
  gatus:
    image: ghcr.io/twin/gatus:stable
    container_name: gatus
    restart: unless-stopped
    env_file:
      - ./secrets/gatus.env
    volumes:
      - ./config/gatus:/config:ro
      - ./data/gatus:/var/lib/gatus
    networks:
      - traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gatus.rule=Host(`uptime.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.gatus.entrypoints=web"
      - "traefik.http.routers.gatus-secure.rule=Host(`uptime.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.gatus-secure.entrypoints=websecure"
      - "traefik.http.routers.gatus-secure.tls=true"
      - "traefik.http.services.gatus.loadbalancer.server.port=8080"

  # Dozzle - Real-time Log Viewer
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.routers.dozzle-secure.rule=Host(`logs.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.dozzle-secure.entrypoints=websecure"
      - "traefik.http.routers.dozzle-secure.tls=true"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

  # FileBrowser Quantum - File Server Web UI
  filebrowser:
    image: gtstef/filebrowser:stable
    container_name: filebrowser
    user: filebrowser
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./data/filebrowser:/home/filebrowser/data
      - ./config/filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro
      - ${DATA_ROOT:-./data/shared}:/folder
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`files.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.filebrowser.entrypoints=web"
      - "traefik.http.routers.filebrowser-secure.rule=Host(`files.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.filebrowser-secure.entrypoints=websecure"
      - "traefik.http.routers.filebrowser-secure.tls=true"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=80"

  # Backrest - Restic Backup UI
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    restart: unless-stopped
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./data/backrest/data:/data
      - ./data/backrest/config:/config
      - ./data/backrest/cache:/cache
      - /volume2/backups:/repos
      - ./data:/userdata:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backrest.rule=Host(`backup.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.backrest.entrypoints=web"
      - "traefik.http.routers.backrest-secure.rule=Host(`backup.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.backrest-secure.entrypoints=websecure"
      - "traefik.http.routers.backrest-secure.tls=true"
      - "traefik.http.services.backrest.loadbalancer.server.port=9898"

  # Home Assistant - Smart Home Hub
  # Host network is required for local device auto-discovery (mDNS/zeroconf,
  # Chromecast, HomeKit). Because host-networked containers can't be on the
  # traefik bridge, Traefik routes to it via the file provider instead of
  # labels (see config/traefik/dynamic/homeassistant.yml).
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Europe/Madrid}
  # Mosquitto MQTT Broker (message bus for Node-RED, ESPHome, Home Assistant)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
    networks:
      - traefik
  # Node-RED - Visual Automation Flows
  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./data/node-red:/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.node-red.rule=Host(`ha-flows.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.node-red.entrypoints=web"
      - "traefik.http.routers.node-red-secure.rule=Host(`ha-flows.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.node-red-secure.entrypoints=websecure"
      - "traefik.http.routers.node-red-secure.tls=true"
      - "traefik.http.services.node-red.loadbalancer.server.port=1880"

  # ESPHome - Manage ESP32/ESP8266 devices
  # Host network for device discovery + OTA. Traefik routes via the file
  # provider instead of labels (see config/traefik/dynamic/esphome.yml).
  esphome:
    image: ghcr.io/esphome/esphome:latest
    container_name: esphome
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Europe/Madrid}
  # Music Assistant - Whole-home audio
  # Host network for player discovery + streaming. Traefik routes via the file
  # provider instead of labels (see config/traefik/dynamic/musicassistant.yml).
  music-assistant:
    image: ghcr.io/music-assistant/server:latest
    container_name: music-assistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/music-assistant:/data
    environment:
      - TZ=${TZ:-Europe/Madrid}
  # Forgejo - Self-hosted Git (GitHub private repos migration)
  forgejo:
    image: codeberg.org/forgejo/forgejo:12
    container_name: forgejo
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - USER_UID=${PUID:-1000}
      - USER_GID=${PGID:-1000}
      - FORGEJO__server__DOMAIN=git.${DOMAIN:?set DOMAIN=n33lab.com}
      - FORGEJO__server__ROOT_URL=https://git.${DOMAIN:?set DOMAIN=n33lab.com}/
      - FORGEJO__server__SSH_DOMAIN=git.${DOMAIN:?set DOMAIN=n33lab.com}
      - FORGEJO__server__SSH_PORT=222
      - FORGEJO__attachment__ALLOWED_TYPES=image/jpeg|image/png|application/zip|application/gzip|application/octet-stream
      - FORGEJO__attachment__MAX_SIZE=512
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__migrations__ALLOWED_DOMAINS=github.com,*.github.com
    volumes:
      - ./data/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "222:22"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`git.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.forgejo.entrypoints=web"
      - "traefik.http.routers.forgejo-secure.rule=Host(`git.${DOMAIN:?set DOMAIN=n33lab.com}`)"
      - "traefik.http.routers.forgejo-secure.entrypoints=websecure"
      - "traefik.http.routers.forgejo-secure.tls=true"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
