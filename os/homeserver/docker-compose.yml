name: lab

networks:
  traefik:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
  pihole_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
  dozzle_agent:
    driver: bridge
    internal: true
volumes:
  model-cache:
  immich-db:
  immich-redis:

secrets:
  cloudflare_dns_api_token:
    file: ./secrets/cloudflare_dns_api_token
  authelia_jwt:
    file: ./secrets/authelia-jwt
  authelia_session:
    file: ./secrets/authelia-session
  authelia_storage_encryption:
    file: ./secrets/authelia-storage-encryption
  authelia_users:
    file: ./secrets/authelia-users
  mqtt-passwd:
    file: ./secrets/mqtt-passwd
  mqtt-acl:
    file: ./secrets/mqtt-acl

services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik@sha256:4df0a50fcf71b454c0d7ad17675776dc8d37359deae3291895bdaa008c1b9972
    container_name: traefik
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN=n33lab.com}
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cloudflare_dns_api_token
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
      - "192.168.1.33:8883:8883"
    command:
      - --api.dashboard=true
      - --providers.docker=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.mqtts.address=:8883
      - --entrypoints.ping.address=:8082
      - --ping=true
      - --ping.entrypoint=ping
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=${ACME_STORAGE:-/letsencrypt/acme.json}
      - --certificatesresolvers.cloudflare.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
    volumes:
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./data/traefik/letsencrypt:/letsencrypt
    secrets:
      - cloudflare_dns_api_token
    networks:
      - traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
  authelia:
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    container_name: authelia
    restart: unless-stopped
    environment:
      - X_AUTHELIA_CONFIG_FILTERS=template
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/run/secrets/authelia-jwt
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/authelia-session
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/run/secrets/authelia-storage-encryption
    volumes:
      - ./config/authelia/configuration.yml:/config/configuration.yml:ro
      - ./data/authelia:/data
    secrets:
      - source: authelia_jwt
        target: authelia-jwt
      - source: authelia_session
        target: authelia-session
      - source: authelia_storage_encryption
        target: authelia-storage-encryption
      - source: authelia_users
        target: authelia-users
    networks:
      - traefik
  # Glance Dashboard
  glance:
    image: glanceapp/glance:v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
    container_name: glance
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - DOMAIN=${DOMAIN:?set DOMAIN=n33lab.com}
      - PIHOLE_PASSWORD=${PIHOLE_PASSWORD:?set in .env}
    volumes:
      - ./config/glance:/app/config:ro
    networks:
      - traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # Dockhand - Docker Management UI
  dockhand:
    image: fnsys/dockhand:latest@sha256:63ffc7dd086f5d10506ccf488bcb30ce40401975212fcc1bed9ec891243c9fb4
    container_name: dockhand
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/dockhand:/data
    networks:
      - traefik
  # Tailscale - VPN Access
  tailscale:
    image: tailscale/tailscale:v1.102.4@sha256:2667499ed87ae29218f292556ba062918402dd5e92e93637af14867e4df12dd3
    container_name: tailscale
    hostname: homeserver
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ROUTES=172.18.0.0/24,172.31.0.0/16,192.168.1.0/24
      - TS_ACCEPT_DNS=false
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    networks:
      - traefik
      - pihole_network

  # Pi-hole DNS Server
  pihole:
    image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    container_name: pihole
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:?set in .env}
      - FTLCONF_dns_upstreams=${PIHOLE_DNS:-1.1.1.1;1.0.0.1}
      - FTLCONF_dns_listeningMode=ALL
      - FTLCONF_dns_dnssec=true
      - FTLCONF_webserver_interface_theme=default-dark
      - FTLCONF_webserver_domain=pihole.${DOMAIN:?set DOMAIN=n33lab.com}
      - FTLCONF_misc_dnsmasq_lines=address=/n33lab.com/192.168.1.33
    volumes:
      - ./config/pihole/etc-pihole:/etc/pihole
    ports:
      - "192.168.1.33:53:53/tcp"
      - "192.168.1.33:53:53/udp"
    dns:
      - 127.0.0.1
      - 1.1.1.1
    cap_add:
      - NET_ADMIN
    networks:
      traefik: {}
      pihole_network:
        ipv4_address: "172.31.0.100"
    labels:
      - "homepage.group=Network"
      - "homepage.name=Pi-hole"
      - "homepage.icon=pihole.png"
      - "homepage.href=https://pihole.${DOMAIN:?set DOMAIN=n33lab.com}/admin"
      - "homepage.description=Network-wide ad blocking and DNS"
      - "homepage.weight=1"
      - "homepage.widget.type=pihole"
      - "homepage.widget.url=http://pihole"
      - "homepage.widget.key=${PIHOLE_API_KEY:-}"

  # DHCP Helper for Pi-hole
  dhcphelper:
    image: noamokman/dhcp-helper@sha256:25a33e63a20f7ec06465653c40ccde3f692a23074d566ee9dcbb11d75307d538
    container_name: dhcp-helper
    restart: unless-stopped
    network_mode: "host"
    command: -s 172.31.0.100
    cap_add:
      - NET_ADMIN

  # qBittorrent Download Client
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:457e4eec2ee3f5e4ef59f237ad51f6143deba9f7445ab48bb5204a98888ef9aa
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Madrid}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_ROOT:-./data/shared}:/data
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - traefik

  # Kavita Ebook and Comics Library
  kavita:
    image: jvmilazz0/kavita@sha256:31181a32f0dda73cae68721867028a7253d57881b58bea5754cd9e578e75421a
    container_name: kavita
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./data/kavita/config:/kavita/config
      - ${DATA_ROOT:-./data/shared}/books:/books:ro
    networks:
      - traefik

  # Immich Photo Management
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.2@sha256:79cc1623323d5894922686d8743b4780181428f98eecbfb58ce12c41ef02d1ea
    container_name: immich_server
    restart: unless-stopped
    volumes:
      - ${UPLOAD_LOCATION:-./data/immich}:/data
      - /etc/localtime:/etc/localtime:ro
      - /home/andrew/immich:/mnt/old-immich:ro
      - /home/andrew/immich-test:/mnt/immich-test:ro
    environment:
      - DB_HOSTNAME=database
    env_file:
      - ./secrets/immich-server.env
    depends_on:
      - redis
      - database
    networks:
      - traefik
    healthcheck:
      disable: false

  # Immich Machine Learning
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2@sha256:60dfcf266a9ef3b7376f5678e8c980d4fb61db5fc48c078fe8a326ab1535d60d
    container_name: immich_machine_learning
    restart: unless-stopped
    volumes:
      - model-cache:/cache
    env_file:
      - ./secrets/immich-ml.env
    networks:
      - traefik
    healthcheck:
      disable: false

  # Immich Redis Cache
  redis:
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    container_name: immich_redis
    restart: unless-stopped
    volumes:
      - immich-redis:/data
    networks:
      - traefik
    healthcheck:
      test: redis-cli ping || exit 1

  # Immich PostgreSQL Database
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich-db:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - traefik

  # Open WebUI for AI
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.3@sha256:41daa0cf2561a5d4c8d1ff31ee2a98d93ab4d3ac2605cac69366ff6a3374a933
    container_name: openwebui
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./data/openwebui:/app/backend/data
    networks:
      - traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Excalidraw Collaborative Whiteboard
  excalidraw:
    image: excalidraw/excalidraw@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
    container_name: excalidraw
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    networks:
      - traefik
  # Gatus Monitoring
  gatus:
    image: ghcr.io/twin/gatus:v5.36.0@sha256:c5f210d095fa78e6efaa20ffeb14803f2ba4f10615e16a6d12087697149617f0
    container_name: gatus
    restart: unless-stopped
    volumes:
      - ./config/gatus:/config:ro
      - ./data/gatus:/var/lib/gatus
    networks:
      - traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # Dozzle - Real-time Log Viewer
  dozzle:
    image: amir20/dozzle:v11.1.0@sha256:7c4fb7f8124f5dea15ade881535cc19cc9a03e66639fd28154ff43a93b78944b
    container_name: dozzle
    restart: unless-stopped
    environment:
      - DOZZLE_REMOTE_HOST=tcp://docker-socket-proxy:2375
    networks:
      - traefik
      - dozzle_agent
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    environment:
      - CONTAINERS=1
      - INFO=1
      - EVENTS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dozzle_agent
  # FileBrowser Quantum - File Server Web UI
  filebrowser:
    image: gtstef/filebrowser:1.5.6-stable@sha256:7c5d7ac8ffda31294d278063cf9d2e04303b39e6dce1f4c691342240ca7703b8
    container_name: filebrowser
    user: filebrowser
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./data/filebrowser:/home/filebrowser/data
      - ./config/filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro
      - ${DATA_ROOT:-./data/shared}:/folder
    networks:
      - traefik
  # Backrest - Restic Backup UI
  backrest:
    image: garethgeorge/backrest:v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
    container_name: backrest
    restart: unless-stopped
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./data/backrest/data:/data
      - ./data/backrest/config:/config
      - ./data/backrest/cache:/cache
      - /volume2/backups:/repos
      - ./data:/userdata:ro
    networks:
      - traefik
  # Home Assistant - Smart Home Hub
  # Host network is required for local device auto-discovery (mDNS/zeroconf,
  # Chromecast, HomeKit). Because host-networked containers can't be on the
  # traefik bridge, Traefik routes to it via the file provider instead of
  # labels (see config/traefik/dynamic/homeassistant.yml).
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.3@sha256:d8922685169707fd91e8b9729902d975f06157d005e422874d201e0261dda196
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/homeassistant:/config
      - ./config/homeassistant-dashboards/home-dashboard.yaml:/config/home-dashboard.yaml:ro
      - ./config/homeassistant-scripts/scripts.yaml:/config/scripts.yaml:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Europe/Madrid}
  # Mosquitto MQTT Broker (message bus for Node-RED, ESPHome, Home Assistant)
  mosquitto:
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "192.168.1.33:1883:1883" # Plain MQTT for trusted LAN IoT clients
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        cp /run/secrets/mqtt-passwd /tmp/mqtt-passwd &&
        cp /run/secrets/mqtt-acl /tmp/mqtt-acl &&
        chmod 600 /tmp/mqtt-passwd /tmp/mqtt-acl &&
        chown 1883:1883 /tmp/mqtt-passwd /tmp/mqtt-acl &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto/data:/mosquitto/data
    secrets:
      - mqtt-passwd
      - mqtt-acl
    networks:
      - traefik
  # Node-RED - Visual Automation Flows
  node-red:
    image: nodered/node-red:5.0.7@sha256:a649dd711d55490151a2c39a8e48ad0c44325488fbc0e66315f2d2e19e5e1ace
    container_name: node-red
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./data/node-red:/data
    networks:
      - traefik
  # ESPHome - Manage ESP32/ESP8266 devices
  # Host network for device discovery + OTA. Traefik routes via the file
  # provider instead of labels (see config/traefik/dynamic/esphome.yml).
  esphome:
    image: ghcr.io/esphome/esphome:2026.9.0@sha256:f6509fcf917a732fd80058567b237d5b9286b9dc6c8dde1b655fbb69ebd600ad
    container_name: esphome
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Europe/Madrid}
    env_file:
      - ./secrets/esphome.env
  # Music Assistant - Whole-home audio
  # Host network for player discovery + streaming. Traefik routes via the file
  # provider instead of labels (see config/traefik/dynamic/musicassistant.yml).
  music-assistant:
    image: ghcr.io/music-assistant/server:2.10.4@sha256:37a9a2776e838a754c9f5b38c432567389952304e7cb8f6b44b6cd28043de6de
    container_name: music-assistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/music-assistant:/data
    environment:
      - TZ=${TZ:-Europe/Madrid}
  # Forgejo - Self-hosted Git (GitHub private repos migration)
  forgejo:
    image: codeberg.org/forgejo/forgejo@sha256:dbb0f88677f0c65cd1b66fb83504225aa5a04c4bc4a5ffdf9fc9a3a6d5bb1c68
    container_name: forgejo
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - USER_UID=${PUID:-1000}
      - USER_GID=${PGID:-1000}
      - FORGEJO__server__DOMAIN=git.${DOMAIN:?set DOMAIN=n33lab.com}
      - FORGEJO__server__ROOT_URL=https://git.${DOMAIN:?set DOMAIN=n33lab.com}/
      - FORGEJO__server__SSH_DOMAIN=git.${DOMAIN:?set DOMAIN=n33lab.com}
      - FORGEJO__server__SSH_PORT=222
      - FORGEJO__attachment__ALLOWED_TYPES=image/jpeg|image/png|application/zip|application/gzip|application/octet-stream
      - FORGEJO__attachment__MAX_SIZE=512
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__migrations__ALLOWED_DOMAINS=github.com,*.github.com
      - FORGEJO__repository__ENABLE_PUSH_CREATE_USER=true
    volumes:
      - ./data/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "222:22"
    networks:
      - traefik
