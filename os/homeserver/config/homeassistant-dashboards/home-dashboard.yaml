title: Casa
views:
  - title: Inicio
    path: home
    icon: mdi:home-variant
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        title: Casa
        columns: 1
        square: false
        cards:
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: template
                entity: climate.faikinac_e474
                icon: mdi:air-conditioner
                icon_color: >-
                  {% if is_state('climate.faikinac_e474', 'cool') %} blue
                  {% elif is_state('climate.faikinac_e474', 'heat') %} red
                  {% elif is_state('climate.faikinac_e474', 'dry') %} amber
                  {% else %} grey
                  {% endif %}
                content: >-
                  {% set temp = state_attr('climate.faikinac_e474', 'current_temperature') %}
                  {{ temp | round(1) ~ ' °C' if temp is number else 'Clima conectando' }}
                tap_action:
                  action: more-info
              - type: weather
                entity: weather.forecast_home
                show_conditions: true
                show_temperature: true
              - type: template
                entity: binary_sensor.faikinac_e474_ac_error_present
                icon: >-
                  {{ 'mdi:alert-circle' if is_state('binary_sensor.faikinac_e474_ac_error_present', 'on') else 'mdi:shield-check' }}
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.faikinac_e474_ac_error_present', 'on') else 'green' }}
                content: >-
                  {{ 'Revisar aire' if is_state('binary_sensor.faikinac_e474_ac_error_present', 'on') else 'Todo bien' }}
                tap_action:
                  action: more-info
            card_mod:
              style: |
                ha-card {
                  --chip-border-radius: 999px;
                  --chip-box-shadow: none;
                  background: transparent;
                  padding: 2px 0 8px;
                }

          - type: custom:mushroom-template-card
            entity: climate.faikinac_e474
            primary: >-
              {% set temp = state_attr('climate.faikinac_e474', 'current_temperature') %}
              {{ temp | round(1) ~ ' °C' if temp is number else 'Clima conectando' }}
            secondary: >-
              {% set target = state_attr('climate.faikinac_e474', 'temperature') %}
              {% set mode = states('climate.faikinac_e474') %}
              {% set rpm = states('sensor.faikinac_e474_fan_rpm') %}
              {{ mode | title if mode not in ['unknown', 'unavailable'] else 'Recuperando estado' }} · objetivo {{ target if target is not none else 'sin dato' }} °C · {{ rpm ~ ' rpm' if rpm not in ['unknown', 'unavailable'] else 'sin telemetría' }}
            icon: mdi:air-conditioner
            color: >-
              {% if is_state('climate.faikinac_e474', 'cool') %} blue
              {% elif is_state('climate.faikinac_e474', 'heat') %} red
              {% elif is_state('climate.faikinac_e474', 'dry') %} amber
              {% else %} grey
              {% endif %}
            multiline_secondary: true
            fill_container: true
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  min-height: 126px;
                  border: 1px solid color-mix(in srgb, var(--primary-color) 28%, transparent);
                  border-radius: 28px;
                  background: color-mix(in srgb, var(--primary-color) 13%, var(--card-background-color));
                  box-shadow: 0 16px 38px rgba(0, 0, 0, 0.18);
                  padding: 12px;
                }

          - type: custom:mushroom-climate-card
            entity: climate.faikinac_e474
            name: Control climático
            icon: mdi:air-conditioner
            layout: horizontal
            fill_container: true
            show_temperature_control: true
            collapsible_controls: false
            hvac_modes:
              - "off"
              - cool
              - heat
              - dry
              - fan_only
            card_mod:
              style: |
                ha-card {
                  border: 1px solid color-mix(in srgb, var(--primary-text-color) 10%, transparent);
                  border-radius: 22px;
                  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
                }

      - type: grid
        title: En movimiento
        columns: 1
        square: false
        cards:
          - type: custom:mushroom-vacuum-card
            entity: vacuum.living_room_rocky
            name: Rocky
            icon: mdi:robot-vacuum
            layout: horizontal
            fill_container: true
            icon_animation: true
            commands:
              - start_pause
              - stop
              - return_home
              - locate
            card_mod:
              style: |
                ha-card {
                  border: 1px solid color-mix(in srgb, var(--primary-text-color) 10%, transparent);
                  border-radius: 22px;
                  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
                }

          - type: custom:mushroom-template-card
            entity: weather.forecast_home
            primary: >-
              {{ state_attr('weather.forecast_home', 'temperature') | float(0) | round(1) }} °C
            secondary: >-
              {{ states('weather.forecast_home') | replace('_', ' ') | title }} · Exterior
            icon: mdi:weather-partly-cloudy
            color: amber
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  border: 1px solid color-mix(in srgb, var(--primary-text-color) 10%, transparent);
                  border-radius: 22px;
                  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
                }

          - type: custom:mushroom-template-card
            entity: todo.shopping_list
            primary: Lista de compra
            secondary: >-
              {{ states('todo.shopping_list') }} pendientes
            icon: mdi:cart-outline
            color: purple
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  border: 1px solid color-mix(in srgb, var(--primary-text-color) 10%, transparent);
                  border-radius: 22px;
                  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
                }

      - type: grid
        title: Sonando
        columns: 1
        square: false
        cards:
          - type: custom:mushroom-media-player-card
            entity: media_player.altavoz_salon_2
            name: Salón
            icon: mdi:speaker-wireless
            layout: horizontal
            fill_container: true
            use_media_info: true
            show_volume_level: true
            collapsible_controls: true
            media_controls:
              - on_off
              - previous
              - play_pause_stop
              - next
            volume_controls:
              - volume_mute
              - volume_set
            card_mod:
              style: |
                ha-card {
                  border: 1px solid color-mix(in srgb, var(--primary-text-color) 10%, transparent);
                  border-radius: 22px;
                  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
                }

          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.living_room_rocky_battery
                primary: >-
                  {% set battery = states('sensor.living_room_rocky_battery') %}
                  {{ battery ~ '%' if battery not in ['unknown', 'unavailable'] else 'Sin datos' }}
                secondary: Rocky
                icon: mdi:battery-high
                color: green
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.backup_backup_manager_state
                primary: >-
                  {{ states('sensor.backup_backup_manager_state') | title }}
                secondary: Backups
                icon: mdi:backup-restore
                color: green
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: binary_sensor.faikinac_e474_connection_state
                primary: >-
                  {{ 'Online' if is_state('binary_sensor.faikinac_e474_connection_state', 'on') else 'Offline' }}
                secondary: Faikin
                icon: mdi:air-conditioner
                color: >-
                  {{ 'green' if is_state('binary_sensor.faikinac_e474_connection_state', 'on') else 'red' }}
                tap_action:
                  action: more-info

      - type: grid
        title: Accesos
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Red doméstica
            secondary: Equipos y conectividad
            icon: mdi:lan
            color: blue
            tap_action:
              action: navigate
              navigation_path: /network-dashboard/red
          - type: custom:mushroom-template-card
            primary: Glance
            secondary: Servicios del lab
            icon: mdi:view-dashboard-outline
            color: teal
            tap_action:
              action: url
              url_path: https://n33lab.com
          - type: custom:mushroom-template-card
            primary: Pi-hole
            secondary: DNS y bloqueos
            icon: mdi:shield-check-outline
            color: green
            tap_action:
              action: url
              url_path: https://pihole.n33lab.com/admin/
          - type: custom:mushroom-template-card
            primary: UGREEN NAS
            secondary: Almacenamiento
            icon: mdi:nas
            color: purple
            tap_action:
              action: url
              url_path: https://192.168.1.33:9443/desktop/?os=ugospro#/

  - title: Clima
