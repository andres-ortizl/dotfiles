                name: Ambiente
              - entity: sensor.faikinac_e474_intake_temperature
                name: Retorno
            card_mod:
              style: |
                ha-card {
                  border: 1px solid color-mix(in srgb, var(--primary-text-color) 10%, transparent);
                  border-radius: 22px;
                  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
                }

      - type: grid
        title: Estado técnico
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: binary_sensor.faikinac_e474_ac_error_present
            name: Errores
            icon: mdi:shield-check-outline
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: sensor.faikinac_e474_ac_error_code
            name: Código
            icon: mdi:alert-circle-outline
            icon_color: red
          - type: custom:mushroom-entity-card
            entity: sensor.faikinac_e474_od_pc_pressure
            name: Presión alta
            icon: mdi:gauge
            icon_color: orange
          - type: custom:mushroom-entity-card
            entity: sensor.faikinac_e474_od_pe_pressure
            name: Presión baja
            icon: mdi:gauge-low
            icon_color: teal
          - type: custom:mushroom-entity-card
            entity: sensor.faikinac_e474_id_op_hours
            name: Horas de uso
            icon: mdi:timer-outline
            icon_color: blue
          - type: custom:mushroom-entity-card
            entity: sensor.faikinac_e474_free_heap
            name: Memoria libre
            icon: mdi:memory
            icon_color: purple

      - type: grid
        title: Configuración
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: select.faikinac_e474_mode
            name: Modos visibles
            icon: mdi:tune-variant
          - type: custom:mushroom-entity-card
            entity: select.faikinac_e474_safemode
            name: Modo seguro
            icon: mdi:shield-lock-outline
          - type: custom:mushroom-entity-card
            entity: select.faikinac_e474_homekit
            name: HomeKit
            icon: mdi:home-automation
          - type: custom:mushroom-entity-card
            entity: select.faikinac_e474_webpanel
            name: Panel web
            icon: mdi:web
          - type: custom:mushroom-entity-card
            entity: number.faikinac_e474_min_temp
            name: Temperatura mínima
            icon: mdi:thermometer-low
          - type: custom:mushroom-entity-card
            entity: number.faikinac_e474_max_temp
            name: Temperatura máxima
            icon: mdi:thermometer-high

  - title: Rocky
    path: rocky
    icon: mdi:robot-vacuum
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        title: Mapa
        columns: 1
