            entity: sensor.faikinac_e474_up_time
            name: Uptime
            icon: mdi:timer-outline
            icon_color: blue
          - type: custom:mushroom-entity-card
            entity: sensor.faikinac_e474_rssi
            name: Señal Wi-Fi
            icon: mdi:wifi
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: sensor.faikinac_e474_free_heap
            name: Memoria libre
            icon: mdi:memory
            icon_color: purple
          - type: custom:mushroom-entity-card
            entity: sensor.faikinac_e474_reset_reason
            name: Último reinicio
            icon: mdi:restart-alert
            icon_color: orange
          - type: custom:mushroom-template-card
            entity: button.faikinac_e474_restart
            primary: Reiniciar Faikin
            secondary: Mantén pulsado
            icon: mdi:restart
            color: orange
            tap_action:
              action: more-info
            hold_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.faikinac_e474_restart
          - type: custom:mushroom-template-card
            entity: button.faikinac_e474_upgrade
            primary: Actualizar firmware
            secondary: Mantén pulsado
            icon: mdi:update
            color: blue
            tap_action:
              action: more-info
            hold_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.faikinac_e474_upgrade

      - type: grid
        title: Administración
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Red doméstica
            secondary: Dashboard de red
            icon: mdi:lan
            color: blue
            tap_action:
              action: navigate
              navigation_path: /network-dashboard/red
          - type: custom:mushroom-template-card
            primary: Glance
            secondary: Servicios del lab
            icon: mdi:view-dashboard-outline
