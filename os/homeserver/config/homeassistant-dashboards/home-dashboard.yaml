  - title: Sistema
    path: sistema
    icon: mdi:server-network
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        title: Copias de seguridad
        columns: 1
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.backup_backup_manager_state
            primary: >-
              {{ states('sensor.backup_backup_manager_state') | title }}
            secondary: Estado del gestor de backups
            icon: mdi:shield-check-outline
            color: >-
              {{ 'green' if states('sensor.backup_backup_manager_state') | lower in ['idle', 'backed_up'] else 'orange' }}
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.backup_last_successful_automatic_backup
            primary: >-
              {% set value = states('sensor.backup_last_successful_automatic_backup') %}
              {{ value if value not in ['unknown', 'unavailable'] else 'Sin registros' }}
            secondary: Última copia correcta
            icon: mdi:backup-restore
            color: blue
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.backup_next_scheduled_automatic_backup
            primary: >-
              {% set value = states('sensor.backup_next_scheduled_automatic_backup') %}
              {{ value if value not in ['unknown', 'unavailable'] else 'Sin programar' }}
            secondary: Próxima copia
            icon: mdi:calendar-clock
            color: purple
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.backup_last_attempted_automatic_backup
            primary: >-
              {% set value = states('sensor.backup_last_attempted_automatic_backup') %}
              {{ value if value not in ['unknown', 'unavailable'] else 'Sin intentos' }}
            secondary: Último intento
            icon: mdi:history
            color: teal
            tap_action:
              action: more-info

      - type: grid
