            show_state: false
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  overflow: hidden;
                  border: 1px solid color-mix(in srgb, var(--primary-text-color) 10%, transparent);
                  border-radius: 28px;
                  box-shadow: 0 16px 38px rgba(0, 0, 0, 0.18);
                }

      - type: grid
