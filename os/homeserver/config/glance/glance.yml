pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: weather
            location: Madrid, Spain
            units: metric
            hour-format: 24h

          - type: dns-stats
            service: pihole-v6
            url: http://pihole
            password: ${PIHOLE_PASSWORD}

      - size: full
        widgets:
          - type: monitor
            cache: 1m
            title: Media & Files
            sites:
              - title: Immich
                url: https://immich.${DOMAIN}
                check-url: http://immich-server:2283
                icon: di:immich
              - title: qBittorrent
                url: https://qbittorrent.${DOMAIN}
                check-url: http://qbittorrent:8080
                alt-status-codes: [401]
                icon: di:qbittorrent
              - title: File Browser
                url: https://files.${DOMAIN}
                check-url: http://filebrowser:80
                icon: di:filebrowser

          - type: monitor
            cache: 1m
            title: Apps
            sites:
              - title: Open WebUI
                url: https://chat.${DOMAIN}
                check-url: http://openwebui:8080
                icon: di:open-webui
              - title: Excalidraw
                url: https://excalidraw.${DOMAIN}
                check-url: http://excalidraw:80
                icon: di:excalidraw

          - type: monitor
            cache: 1m
            title: Infrastructure
            sites:
              - title: Pi-hole
                url: https://pihole.${DOMAIN}/admin/
                check-url: http://pihole/admin/
                icon: di:pi-hole
              - title: Traefik
                url: https://traefik.${DOMAIN}/dashboard/
                check-url: http://traefik:8082/ping
                icon: di:traefik
              - title: Dockhand
                url: https://docker.${DOMAIN}
                check-url: http://dockhand:3000
                icon: mdi:docker
              - title: Dozzle
                url: https://logs.${DOMAIN}
                check-url: http://dozzle:8080
                icon: di:dozzle
              - title: Gatus
                url: https://uptime.${DOMAIN}
                check-url: http://gatus:8080
                alt-status-codes: [401]
                icon: di:gatus
              - title: Backrest
                url: https://backup.${DOMAIN}
                check-url: http://backrest:9898
                icon: di:backrest
              - title: UGREEN NAS
                url: https://192.168.1.33:9443/desktop/?os=ugospro#/
                check-url: http://host.docker.internal:9999
                alt-status-codes: [307]
                icon: mdi:nas

          - type: monitor
            cache: 1m
            title: Smart Home
            sites:
              - title: Home Assistant
                url: https://ha.${DOMAIN}
                check-url: http://host.docker.internal:8123
                icon: di:home-assistant
              - title: ESPHome
                url: https://ha-esphome.${DOMAIN}
                check-url: http://host.docker.internal:6052
                icon: di:esphome
              - title: Music Assistant
                url: https://ha-music.${DOMAIN}
                check-url: http://host.docker.internal:8095
                icon: di:music-assistant
              - title: Node-RED
                url: https://ha-flows.${DOMAIN}
                check-url: http://node-red:1880
                icon: di:node-red

          - type: rss
            title: News
            style: horizontal-cards
            cache: 3h
            limit: 12
            collapse-after: 6
            feeds:
              - url: https://hnrss.org/frontpage
                title: Hacker News
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://www.reddit.com/r/selfhosted/.rss
                title: r/selfhosted
              - url: https://feeds.arstechnica.com/arstechnica/index
                title: Ars Technica
              - url: https://www.theverge.com/rss/index.xml
                title: The Verge

  - name: Briefing
    columns:
      - size: full
        widgets:
          - type: hacker-news
            sort-by: top
            limit: 8
            collapse-after: 5
            cache: 30m

          - type: rss
            title: AI & Tech
            style: horizontal-cards
            cache: 6h
            limit: 9
            collapse-after: 6
            feeds:
              - url: https://www.technologyreview.com/topic/artificial-intelligence/feed/
                title: MIT Technology Review AI
                limit: 3
              - url: https://techcrunch.com/category/artificial-intelligence/feed/
                title: TechCrunch AI
                limit: 3
              - url: https://tldr.tech/api/rss/ai
                title: TLDR AI
                limit: 3
                headers:
                  Accept: application/rss+xml, application/xml;q=0.9, */*;q=0.8
                  User-Agent: Glance RSS reader

          - type: rss
            title: España
            style: detailed-list
            cache: 3h
            limit: 9
            collapse-after: 6
            feeds:
              - url: https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada
                title: El País
                limit: 3
              - url: https://www.eldiario.es/rss/
                title: elDiario.es
                limit: 3
              - url: https://www.xataka.com/index.xml
                title: Xataka
                limit: 3

          - type: rss
            title: Mundo
            style: vertical-list
            cache: 3h
            limit: 8
            collapse-after: 5
            feeds:
              - url: https://feeds.bbci.co.uk/news/world/rss.xml
                title: BBC World
                limit: 4
              - url: https://www.theguardian.com/world/rss
                title: The Guardian World
                limit: 4

      - size: small
        widgets:
          - type: bookmarks
            title: Quick Reads
            groups:
              - title: Daily Briefings
                links:
                  - title: daily.dev
                    url: https://app.daily.dev/
                  - title: AlphaSignal Archive
                    url: https://alphasignal.ai/archive
                  - title: TLDR AI Archive
                    url: https://tldr.tech/ai/archives

          - type: releases
            cache: 1d
            limit: 9
            collapse-after: 5
            repositories:
              - home-assistant/core
              - immich-app/immich
              - traefik/traefik
              - authelia/authelia
              - TwiN/gatus
              - esphome/esphome
              - node-red/node-red
              - open-webui/open-webui
              - amir20/dozzle

          - type: monitor
            title: External Status
            cache: 10m
            sites:
              - title: GitHub Status
                url: https://www.githubstatus.com/
              - title: OpenAI Status
                url: https://status.openai.com/
              - title: Cloudflare Status
                url: https://www.cloudflarestatus.com/
