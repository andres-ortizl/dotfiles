pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: weather
            location: Madrid, Spain
            units: metric
            hour-format: 24h

          - type: dns-stats
            service: pihole-v6
            url: http://pihole
            password: ${PIHOLE_PASSWORD}

      - size: full
        widgets:
          - type: monitor
            cache: 1m
            title: Media & Files
            sites:
              - title: Immich
                url: https://immich.${DOMAIN}
                check-url: http://immich-server:2283
                icon: di:immich
              - title: qBittorrent
                url: https://qbittorrent.${DOMAIN}
                check-url: http://qbittorrent:8080
                alt-status-codes: [401]
                icon: di:qbittorrent
              - title: File Browser
                url: https://files.${DOMAIN}
                check-url: http://filebrowser:80
                icon: di:filebrowser

          - type: monitor
            cache: 1m
            title: Apps
            sites:
              - title: Open WebUI
                url: https://chat.${DOMAIN}
                check-url: http://openwebui:8080
                icon: di:open-webui
              - title: Excalidraw
                url: https://excalidraw.${DOMAIN}
                check-url: http://excalidraw:80
                icon: di:excalidraw

          - type: monitor
            cache: 1m
            title: Infrastructure
            sites:
              - title: Pi-hole
                url: https://pihole.${DOMAIN}/admin/
                check-url: http://pihole/admin/
                icon: di:pi-hole
              - title: Traefik
                url: https://traefik.${DOMAIN}
                check-url: http://traefik:8080/dashboard/
                icon: di:traefik
              - title: Dockhand
                url: https://docker.${DOMAIN}
                check-url: http://dockhand:3000
                icon: mdi:docker
              - title: Dozzle
                url: https://logs.${DOMAIN}
                check-url: http://dozzle:8080
                icon: di:dozzle
              - title: Gatus
                url: https://uptime.${DOMAIN}
                check-url: http://gatus:8080
                alt-status-codes: [401]
                icon: di:gatus
              - title: Backrest
                url: https://backup.${DOMAIN}
                check-url: http://backrest:9898
                icon: di:backrest
              - title: UGREEN NAS
                url: https://nas.local:9443
                icon: mdi:nas

          - type: monitor
            cache: 1m
            title: Smart Home
            sites:
              - title: Home Assistant
                url: https://ha.${DOMAIN}
                check-url: http://host.docker.internal:8123
                icon: di:home-assistant
              - title: ESPHome
                url: https://ha-esphome.${DOMAIN}
                check-url: http://host.docker.internal:6052
                icon: di:esphome
              - title: Music Assistant
                url: https://ha-music.${DOMAIN}
                check-url: http://host.docker.internal:8095
                icon: di:music-assistant
              - title: Node-RED
                url: https://ha-flows.${DOMAIN}
                check-url: http://node-red:1880
                icon: di:node-red

          - type: rss
            title: News
            style: horizontal-cards
            cache: 3h
            limit: 12
            collapse-after: 6
            feeds:
              - url: https://hnrss.org/frontpage
                title: Hacker News
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://www.reddit.com/r/selfhosted/.rss
                title: r/selfhosted
              - url: https://feeds.arstechnica.com/arstechnica/index
                title: Ars Technica
              - url: https://www.theverge.com/rss/index.xml
                title: The Verge
