[package]
name = "soloist-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
oauth2 = { version = "5.0.0", features = ["reqwest"] }
ratatui = "0.30.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "fs", "signal", "io-util"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.4"
tracing = "0.1.44"
url = "2.5.8"

[profile.release]
lto = "thin"
strip = true
