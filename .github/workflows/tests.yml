name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotfiles:
    name: Dotfiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate configuration
        run: ./bin/validate-configs
      - name: Test installation
        run: ./install

  rust:
    name: Rust (${{ matrix.app }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: soloist-tui
            os: ubuntu-latest
            path: apps/soloist-tui
          - app: specdex
            os: macos-latest
            path: apps/specdex
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.path }}
      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: cargo test --workspace --all-targets --all-features --locked
