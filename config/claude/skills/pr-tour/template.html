<style>

.vbtn:hover { transform: translateY(-1px); }

.saved.ok { color: var(--ok); }
textarea.comment { width: 100%; margin-top: 12px; min-height: 84px; resize: vertical; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--fg); font: inherit; font-size: 13.5px; line-height: 1.5; }
textarea.comment:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }

.navbtn:hover { border-color: var(--accent); transform: translateY(-1px); }

.summary table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }

.summary td.v { white-space: nowrap; }
.summary .vtag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
.summary .vtag i { width: 7px; height: 7px; border-radius: 50%; }
.vtag.ok { background: var(--ok-soft); color: var(--ok); } .vtag.ok i { background: var(--ok); }
.vtag.change { background: var(--change-soft); color: var(--change); } .vtag.change i { background: var(--change); }

.btn { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--card); font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

<header class="top"><div class="top-inner">
  <div class="brand"><h1 id="t-title"></h1><span class="sub" id="t-sub"></span></div>
  <div class="progress"><div class="bar"><i id="bar"></i></div><span class="counter" id="counter"></span></div>
  <div class="pills">
    <span class="pill ok"><i></i><span id="n-ok">0</span></span>
    <span class="pill change"><i></i><span id="n-change">0</span></span>
    <span class="pill ask"><i></i><span id="n-ask">0</span></span>
  </div>
  <span class="storage" id="storage">conectando…</span>
</div></header>

<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main class="stage" id="stage"></main>
</div>
<canvas id="confetti" hidden></canvas>
<div class="toast" id="toast"></div>

<script>
const TOUR = /*__TOUR__*/null;
const STOPS = [];
TOUR.flows.forEach(flow => flow.stops.forEach((stop, i) => STOPS.push({ ...stop, flow, n: STOPS.length + 1, idxInFlow: i })));
const VERDICTS = { ok: "OK", change: "Cambiar", ask: "Pregunta" };
const state = { cur: 0, reviews: {}, storage: "connecting" };
const LS_KEY = `pr-tour:${TOUR.id}`;
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");

function readCache() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; } }
function writeCache() { try { localStorage.setItem(LS_KEY, JSON.stringify(state.reviews)); } catch {} }

let db = null;
const writing = {};
async function initDb() {
  try { db = (await window.claude?.use?.("db")) ?? null; } catch { db = null; }
  if (!db) { state.storage = "local"; renderTop(); return; }
  try {
    db.collection(`reviews/${TOUR.id}/stops`).onSnapshot(snap => {
      snap.docs.forEach(d => { if (d.exists) state.reviews[d.id] = d.data(); });
      state.storage = "live"; writeCache(); renderAll();
    }, () => { state.storage = "local"; renderTop(); });
  } catch { state.storage = "local"; renderTop(); }
}
function persist(stopId) {
  writeCache();
  if (!db) return Promise.resolve();
  const data = state.reviews[stopId];
  writing[stopId] = (writing[stopId] || Promise.resolve()).then(() => db.doc(`reviews/${TOUR.id}/stops/${stopId}`).set(data)).catch(() => { state.storage = "local"; renderTop(); });
  return writing[stopId];
}
function review(stop) { return state.reviews[stop.id] || {}; }
function setVerdict(stop, verdict) {
  const r = review(stop);
  state.reviews[stop.id] = { ...r, verdict: r.verdict === verdict ? null : verdict, comment: r.comment || "", sig: stop.sig, head: TOUR.head, updatedAt: new Date().toISOString() };
  persist(stop.id).then(() => flashSaved());
  renderTop(); renderRail(); renderFlowMap(stop);
  const btn = $(`.vbtn.${verdict}`); if (btn) { btn.classList.add("pop"); setTimeout(() => btn.classList.remove("pop"), 400); }
  $$verdictButtons(stop);
  const dot = $(`#rail .stop-link[data-id="${stop.id}"] .dot`); if (dot) { dot.classList.add("pop"); setTimeout(() => dot.classList.remove("pop"), 400); }
  if (state.reviews[stop.id].verdict && allDone()) celebrate();
  else if (state.reviews[stop.id].verdict) toast(`${stop.n}/${STOPS.length} · ${VERDICTS[verdict]}`);
}
let commentTimer = null;
function setComment(stop, text) {
  const r = review(stop);
  state.reviews[stop.id] = { ...r, verdict: r.verdict || null, comment: text, sig: stop.sig, head: TOUR.head, updatedAt: new Date().toISOString() };
  $("#saved").textContent = "guardando…"; $("#saved").classList.remove("ok");
  clearTimeout(commentTimer);
  commentTimer = setTimeout(() => persist(stop.id).then(() => flashSaved()), 700);
}
function flashSaved() { const el = $("#saved"); if (!el) return; el.textContent = state.storage === "live" ? "guardado ✓" : "guardado aquí ✓"; el.classList.add("ok"); }
function allDone() { return STOPS.every(s => review(s).verdict); }
function counts() { const c = { ok: 0, change: 0, ask: 0 }; STOPS.forEach(s => { const v = review(s).verdict; if (v) c[v]++; }); return c; }

function renderTop() {
  $("#t-title").textContent = TOUR.title; $("#t-sub").textContent = TOUR.subtitle;
  const c = counts(); const done = c.ok + c.change + c.ask;
  $("#bar").style.width = `${(done / STOPS.length) * 100}%`;
  $("#counter").textContent = state.cur < STOPS.length ? `parada ${state.cur + 1} de ${STOPS.length} · ${done} con veredicto` : `${done} de ${STOPS.length} con veredicto`;
  $("#n-ok").textContent = c.ok; $("#n-change").textContent = c.change; $("#n-ask").textContent = c.ask;
  const st = $("#storage");
  st.className = "storage" + (state.storage === "live" ? " live" : "");
  st.textContent = state.storage === "live" ? "veredictos guardados en la página" : state.storage === "local" ? "sin base: se guarda solo en este navegador" : "conectando…";
}
function renderRail() {
  const rail = $("#rail"); rail.innerHTML = "";
  TOUR.flows.forEach(flow => {
    const g = document.createElement("div"); g.className = "flow-group";
    g.innerHTML = `<div class="flow-head"><b>${esc(flow.name)}</b><span>${flow.stops.length} paradas</span></div>`;
    flow.stops.forEach(stop => {
      const s = STOPS.find(x => x.id === stop.id); const v = review(s).verdict;
      const b = document.createElement("button");
      b.className = `stop-link${state.cur === s.n - 1 ? " current" : ""}${v ? " " + v : ""}`; b.dataset.id = s.id;
      b.innerHTML = `<span class="dot">${v ? "" : s.n}</span><span class="lbl">${esc(s.title)}<small>${s.chunks.length} cambio${s.chunks.length === 1 ? "" : "s"}${s.test_chunks.length ? ` · ${s.test_chunks.length} test${s.test_chunks.length === 1 ? "" : "s"}` : ""}</small></span>`;
      b.onclick = () => go(s.n - 1);
      g.appendChild(b);
    });
    rail.appendChild(g);
  });
  const sum = document.createElement("button"); sum.className = `stop-link summary-link${state.cur === STOPS.length ? " current" : ""}`;
  sum.innerHTML = `<span class="dot">Σ</span><span class="lbl">Resumen<small>veredictos y comentarios</small></span>`;
  sum.onclick = () => go(STOPS.length); rail.appendChild(sum);
}
function flowMapSvg(stop) {
  const stops = stop.flow.stops.map(s => STOPS.find(x => x.id === s.id));
  const W = 150, H = 58, bw = 132, bh = 34, y = 14;
  const nodes = stops.map((s, i) => {
    const x = 8 + i * W; const v = review(s).verdict; const cur = s.id === stop.id;
    const label = s.title.length > 20 ? s.title.slice(0, 19) + "…" : s.title;
    return `<g class="node${cur ? " current" : ""}${v ? " " + v : ""}" data-n="${s.n}"><rect x="${x}" y="${y}" width="${bw}" height="${bh}"></rect><text x="${x + 10}" y="${y + 21}">${esc(label)}</text>${v ? `<circle class="v" cx="${x + bw - 8}" cy="${y + 8}"></circle>` : ""}</g>`;
  });
  const edges = stops.slice(1).map((_, i) => { const x1 = 8 + i * W + bw, x2 = 8 + (i + 1) * W; const cy = y + bh / 2; return `<path class="edge" d="M${x1} ${cy} L${x2 - 6} ${cy}"></path><polygon class="arrow" points="${x2 - 7},${cy - 4} ${x2},${cy} ${x2 - 7},${cy + 4}"></polygon>`; });
  const width = 8 + stops.length * W;
  return `<svg role="img" aria-label="Paradas del flujo ${esc(stop.flow.name)}" viewBox="0 0 ${width} ${H}" width="${width}" height="${H}">${edges.join("")}${nodes.join("")}</svg>`;
}
function renderFlowMap(stop) { const m = $("#flow-map"); if (!m) return; m.innerHTML = flowMapSvg(stop); m.querySelectorAll(".node").forEach(n => n.onclick = () => go(+n.dataset.n - 1)); }
function lineHtml(s, lang) {
  if (!s) return "";
  try { if (window.hljs && hljs.getLanguage(lang)) return hljs.highlight(s, { language: lang, ignoreIllegals: true }).value; } catch {}
  return esc(s);
}
function chunkHtml(c, isTest) {
  let o = c.old_start, n = c.new_start;
  const rows = c.lines.map(l => {
    const cls = l.t === "+" ? "add" : l.t === "-" ? "del" : "ctx";
    const on = l.t === "+" ? "" : o++, nn = l.t === "-" ? "" : n++;
    return `<tr class="${cls}"><td class="n">${on}</td><td class="n">${nn}</td><td class="g">${l.t === " " ? "" : l.t}</td><td class="c">${lineHtml(l.s, c.lang)}</td></tr>`;
  }).join("");
  const ref = c.status === "deleted" ? TOUR.base : TOUR.head;
  const href = `${TOUR.repo}/blob/${ref}/${c.path}#L${c.new_start}`;
  const st = isTest ? `<span class="st test">test</span>` : c.status === "added" ? `<span class="st added">nuevo</span>` : `<span class="st">${esc(c.name.split(".").pop())}</span>`;
  return `<div class="chunk"><div class="chunk-head"><span class="path mono"><a href="${href}" target="_blank" rel="noopener" title="${esc(c.path)}">${esc(c.name)}:${c.new_start}</a></span><span class="ctx mono">${esc(c.test ? "def " + c.test + "(" : c.context)}</span>${st}</div><div class="diff"><table>${rows}</table></div></div>`;
}
function $$verdictButtons(stop) { const v = review(stop).verdict; document.querySelectorAll(".vbtn").forEach(b => b.classList.toggle("on", b.dataset.v === v)); }
function renderStop(stop) {
  const r = review(stop);
  const codeChunks = stop.chunks.filter(c => !c.path.includes("/tests/"));
  const testChunks = [...stop.test_chunks, ...stop.chunks.filter(c => c.path.includes("/tests/"))];
  const changed = r.sig && r.sig !== stop.sig;
  const prev = STOPS[stop.n - 2], next = STOPS[stop.n];
  $("#stage").innerHTML = `
    <div class="flow-banner">
      <div class="eyebrow"><span class="k">${esc(stop.flow.name)}</span><span>paso ${stop.idxInFlow + 1} de ${stop.flow.stops.length}</span></div>
      <p class="flow-blurb">${esc(stop.flow.blurb)}</p>
      <div class="flow-map" id="flow-map"></div>
    </div>
    <article class="card">
      <h2>${esc(stop.title)}${changed ? `<span class="changed">cambió desde tu comentario</span>` : ""}</h2>
      <div class="why">${md(stop.why)}</div>
      ${(stop.notes || []).map(n => `<div class="note kind-${esc(n.kind)}"><span class="tag">${esc(n.kind)}</span><span>${md(n.text)}</span></div>`).join("")}
      <div class="chunks">${codeChunks.map(c => chunkHtml(c, false)).join("")}</div>
      ${testChunks.length ? `<details class="tests"><summary><span class="chev">▶</span>Pruebas de esta parada<span class="tests-list">${stop.test_chunks.map(t => `<span class="tname mono">${esc(t.test)}</span>`).join("")}</span></summary><div class="chunks">${testChunks.map(c => chunkHtml(c, true)).join("")}</div></details>` : ""}
      <div class="verdict">
        <div class="verdict-row">
          <button class="vbtn ok" data-v="ok"><kbd>1</kbd> OK</button>
          <button class="vbtn change" data-v="change"><kbd>2</kbd> Cambiar</button>
          <button class="vbtn ask" data-v="ask"><kbd>3</kbd> Pregunta</button>
          <span class="saved" id="saved">${r.updatedAt ? "guardado ✓" : ""}</span>
        </div>
        <textarea class="comment" id="comment" placeholder="Qué cambiarías, qué no entiendes, qué te gusta. Se guarda solo.">${esc(r.comment || "")}</textarea>
        <div class="hint"><kbd>j</kbd>/<kbd>k</kbd> siguiente y anterior · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> veredicto · <kbd>c</kbd> comentar · <kbd>Esc</kbd> salir del comentario</div>
      </div>
    </article>
    <div class="nav">
      <button class="navbtn prev" ${prev ? "" : "disabled"}><small>anterior</small><span>${prev ? esc(prev.title) : "—"}</span></button>
      <button class="navbtn next"><small>${next ? "siguiente" : "al final"}</small><span>${next ? esc(next.title) : "Resumen"}</span></button>
    </div>`;
  renderFlowMap(stop);
  $$verdictButtons(stop);
  document.querySelectorAll(".vbtn").forEach(b => b.onclick = () => setVerdict(stop, b.dataset.v));
  $("#comment").addEventListener("input", e => setComment(stop, e.target.value));
  $(".navbtn.prev").onclick = () => go(stop.n - 2);
  $(".navbtn.next").onclick = () => go(stop.n);
  if (r.updatedAt) $("#saved").classList.add("ok");
}
function renderSummary() {
  const rows = STOPS.map(s => { const r = review(s); const v = r.verdict || "none"; return `<tr><td class="mono">${s.n}</td><td>${esc(s.flow.name)} · ${esc(s.title)}${r.sig && r.sig !== s.sig ? `<span class="changed">cambió</span>` : ""}</td><td class="v"><span class="vtag ${v}"><i></i>${v === "none" ? "sin veredicto" : VERDICTS[v]}</span></td><td>${esc(r.comment || "")}</td></tr>`; }).join("");
  const left = TOUR.leftovers || [];
  $("#stage").innerHTML = `
    <div class="flow-banner"><div class="eyebrow"><span class="k">Resumen</span><span>${STOPS.length} paradas · head ${esc(TOUR.head.slice(0, 10))}</span></div></div>
    <article class="card summary">
      <h2>Tu review, parada a parada</h2>
      <p class="flow-blurb">Copia el resumen y pégalo en el chat: lo convierto en la siguiente ronda para el coder.</p>
      <table><thead><tr><th>#</th><th>Parada</th><th>Veredicto</th><th>Comentario</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="actions"><button class="btn primary" id="copy">Copiar como Markdown</button><button class="btn" id="back">Volver a la primera parada</button></div>
      ${left.length ? `<details class="leftovers"><summary>${left.length} hunk(s) fuera del tour</summary><div class="chunks">${left.map(c => chunkHtml(c, c.path.includes("/tests/"))).join("")}</div></details>` : ""}
    </article>`;
  $("#copy").onclick = async () => {
    const lines = [`# Review ${TOUR.title} (${TOUR.head.slice(0, 10)})`, ""];
    STOPS.forEach(s => { const r = review(s); lines.push(`- **${s.n}. ${s.title}** · ${r.verdict ? VERDICTS[r.verdict] : "sin veredicto"}${r.comment ? `\n  ${r.comment.replace(/\n/g, "\n  ")}` : ""}`); });
    try { await navigator.clipboard.writeText(lines.join("\n")); toast("Copiado"); } catch { toast("No pude copiar; selecciona la tabla"); }
  };
  $("#back").onclick = () => go(0);
}
function go(i) {
  state.cur = Math.max(0, Math.min(STOPS.length, i));
  try { localStorage.setItem(LS_KEY + ":cur", String(state.cur)); } catch {}
  renderAll(); window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function renderAll() { renderTop(); renderRail(); if (state.cur < STOPS.length) renderStop(STOPS[state.cur]); else renderSummary(); }

let toastTimer = null;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1400); }
function celebrate() {
  toast("¡Tour completo! Mira el resumen.");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext("2d"); const colors = ["#6d5cff", "#16a34a", "#d97706", "#e11d48", "#0ea5e9"];
  const parts = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4, r: 4 + Math.random() * 5, a: Math.random() * Math.PI, col: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    const dt = (t - t0) / 1000; ctx.clearRect(0, 0, c.width, c.height);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.a += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.globalAlpha = Math.max(0, 1 - dt / 1.8); ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); });
    if (dt < 1.9) requestAnimationFrame(frame); else { c.hidden = true; }
  })(t0);
}
document.addEventListener("keydown", e => {
  const inText = e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT");
  if (e.key === "Escape" && inText) { e.target.blur(); return; }
  if (inText || e.metaKey || e.ctrlKey || e.altKey) return;
  const stop = STOPS[state.cur];
  if (e.key === "j" || e.key === "ArrowRight") { e.preventDefault(); go(state.cur + 1); }
  else if (e.key === "k" || e.key === "ArrowLeft") { e.preventDefault(); go(state.cur - 1); }
  else if (stop && e.key === "1") setVerdict(stop, "ok");
  else if (stop && e.key === "2") setVerdict(stop, "change");
  else if (stop && e.key === "3") setVerdict(stop, "ask");
  else if (stop && e.key === "c") { e.preventDefault(); $("#comment")?.focus(); }
});
state.reviews = readCache();
try { state.cur = Math.min(STOPS.length, parseInt(localStorage.getItem(LS_KEY + ":cur") || "0", 10) || 0); } catch {}
renderAll();
initDb();
</script>
