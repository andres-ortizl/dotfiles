$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    contrast = 1.0
    brightness = 0.62
    vibrancy = 0.14
    vibrancy_darkness = 0.18
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 76
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a6adc8ff)
    font_size = 16
    font_family = $font
    position = 0, 88
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(bac2deff)
    font_size = 15
    font_family = $font
    position = 0, -56
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    fade_on_empty = false
    hide_input = true

    outer_color = rgba(cba6f7cc)
    inner_color = rgba(1e1e2ed9)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(89dcebff)
    fail_color = rgba(f38ba8ff)
    placeholder_text = Enter password
    fail_text = $PAMFAIL
    font_family = $font

    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = Esc clears input
    color = rgba(6c7086dd)
    font_size = 12
    font_family = $font
    position = 0, -148
    halign = center
    valign = center
}
