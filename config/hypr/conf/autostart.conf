# Bootstrap the tracked user-session units.
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once=systemctl --user start hyprland-session.target

# Session-specific setup that does not belong in systemd.
exec-once=hyprctl setcursor Catppuccin-Mocha-Mauve 16
exec-once=~/.config/hypr/scripts/hypr-warmlight
