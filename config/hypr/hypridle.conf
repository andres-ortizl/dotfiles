general {
    ignore_dbus_inhibit = false
}

general {
    lock_cmd = pidof hyprlock || hyprlock --immediate-render --no-fade-in       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = pidof hyprlock || hyprlock --immediate-render --no-fade-in    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# Screenlock
listener {
    # HYPRLOCK TIMEOUT
    timeout = 600
    # HYPRLOCK ONTIMEOUT
    on-timeout = pidof hyprlock || hyprlock --immediate-render --no-fade-in
}

# dpms
listener {
    # Turn off the screen 5 min after the lock (lock timeout is 600s above).
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend
listener {
    # SUSPEND TIMEOUT
    timeout = 0
    #SUSPEND ONTIMEOUT
    # on-timeout = systemctl suspend
}
